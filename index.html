<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Quét QR</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--pr:#2563eb;--bd:#e5e7eb;--dg:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2027;--tx:#eceff3;--mu:#9aa3af;--bd:#2c333c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px)}
h1{font-size:20px;margin:14px 0 4px}
.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.d{background:none;color:var(--dg);padding:6px 8px}
.wrap{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--mu)}
tr:last-child td{border-bottom:0}
input.stt{width:64px;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.qr{word-break:break-all;min-width:120px}
.empty{color:var(--mu)}
.sr{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin-bottom:8px}
tr.dup td{background:rgba(220,38,38,.13)}
button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.cnt{color:var(--mu);font-size:13px;margin:8px 2px}
#ov{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:9}
#ov.on{display:flex}
video{flex:1;width:100%;object-fit:cover;min-height:0}
#st{color:#fff;padding:12px;text-align:center;background:#000;padding-bottom:calc(env(safe-area-inset-bottom) + 12px)}
#st .row{display:flex;gap:8px;justify-content:center;margin-top:8px}
#st button{background:#fff;color:#000}
.fr{position:absolute;left:50%;top:40%;width:60vw;max-width:280px;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #22c55e;border-radius:16px;pointer-events:none}
</style>
</head>
<body>
<h1>Quét QR</h1>
<div class="sub">Cột 1: số thứ tự (sửa được) · Cột 2: dữ liệu quét từ mã QR</div>
<div class="bar">
  <button id="scanAll">📷 Quét liên tục</button>
  <button id="photoAll">📸 Chụp ảnh để đọc</button>
  <button class="g" id="add">＋ Thêm dòng</button>
  <button class="g" id="csv">Xuất CSV</button>
  <button class="g" id="clr">Xóa hết</button>
</div>
<input class="sr" id="q" type="search" placeholder="🔍 Tìm theo STT hoặc nội dung QR…">
<div class="bar">
  <button class="g" id="dupT">Chỉ hiện mã trùng</button>
  <button class="g" id="dupX">Xóa mã trùng</button>
</div>
<div class="wrap"><table>
  <thead><tr><th>STT</th><th>Mã QR</th><th></th></tr></thead>
  <tbody id="tb"></tbody>
</table></div>
<div class="cnt" id="cnt"></div>

<div id="ov">
  <video id="v" playsinline muted></video>
  <div class="fr"></div>
  <div id="st"><div id="msg">Đang mở camera…</div>
    <div class="row"><button id="photoOv">📸 Chụp ảnh</button><button id="close">Đóng</button></div>
  </div>
</div>
<canvas id="cv" hidden></canvas>
<input type="file" id="file" accept="image/*" capture="environment" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const KEY='qr_rows_v1';
let rows=[];
try{rows=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){rows=[]}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){}};
const nextStt=()=>{const n=rows.map(r=>parseFloat(r.stt)).filter(x=>!isNaN(x));return String(n.length?Math.max(...n)+1:1)};

let query='',onlyDup=false;
function render(){
  const tb=$('tb');tb.innerHTML='';
  const cnt={};rows.forEach(r=>{if(r.qr)cnt[r.qr]=(cnt[r.qr]||0)+1});
  const isDup=r=>r.qr&&cnt[r.qr]>1;
  const ql=query.trim().toLowerCase();
  let shown=0;
  rows.forEach((r,i)=>{
    if(onlyDup&&!isDup(r))return;
    if(ql&&!(String(r.stt).toLowerCase().includes(ql)||String(r.qr).toLowerCase().includes(ql)))return;
    shown++;
    const tr=document.createElement('tr');
    if(isDup(r))tr.className='dup';
    const t1=document.createElement('td');
    const inp=document.createElement('input');
    inp.className='stt';inp.value=r.stt;inp.inputMode='numeric';
    inp.onchange=()=>{r.stt=inp.value;save()};
    t1.appendChild(inp);
    const t2=document.createElement('td');t2.className='qr';
    t2.innerHTML=r.qr?'':'<span class="empty">(chưa quét)</span>';
    if(r.qr)t2.textContent=r.qr;
    const t3=document.createElement('td');t3.style.whiteSpace='nowrap';
    const b=document.createElement('button');b.className='g';b.textContent='📷';
    b.onclick=()=>startScan(i);
    const x=document.createElement('button');x.className='d';x.textContent='✕';
    x.onclick=()=>{rows.splice(i,1);save();render()};
    t3.append(b,x);
    tr.append(t1,t2,t3);tb.appendChild(tr);
  });
  const nd=rows.filter(isDup).length;
  $('cnt').textContent=(shown===rows.length?rows.length+' dòng':shown+'/'+rows.length+' dòng')+(nd?' · '+nd+' dòng trùng (tô đỏ)':'');
  $('dupT').classList.toggle('on',onlyDup);
  save();
}

let stream=null,mode=null,raf=0,last='',lastT=0,lastScan=0;

function handleResult(data){
  if(navigator.vibrate)navigator.vibrate(80);
  if(mode==='all'){
    rows.push({stt:nextStt(),qr:data});render();
    $('msg').textContent='✓ Đã lưu: '+data.slice(0,60);
  }else{
    rows[mode].qr=data;render();stopScan();
  }
}

async function startScan(target){
  mode=target;last='';
  $('ov').classList.add('on');$('msg').textContent='Đang mở camera…';
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}},
      audio:false
    });
    // bật lấy nét liên tục nếu máy hỗ trợ
    try{
      const tr=stream.getVideoTracks()[0];
      const cap=tr.getCapabilities?tr.getCapabilities():{};
      if(cap.focusMode&&cap.focusMode.includes('continuous')){
        await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});
      }
    }catch(e){}
    const v=$('v');v.srcObject=stream;await v.play();
    $('msg').textContent=target==='all'?'Đưa mã QR vào khung (quét liên tục)':'Đưa mã QR vào khung';
    tick();
  }catch(e){
    $('msg').textContent='Không mở được camera. Hãy cho phép quyền camera và mở app qua https.';
  }
}
function stopScan(){
  cancelAnimationFrame(raf);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $('ov').classList.remove('on');
}
function tick(){
  const v=$('v'),now=Date.now();
  if(now-lastScan>100&&v.readyState===v.HAVE_ENOUGH_DATA&&window.jsQR){
    lastScan=now;
    const c=$('cv'),w=v.videoWidth,h=v.videoHeight;
    c.width=w;c.height=h;
    const ctx=c.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(v,0,0,w,h);
    const res=jsQR(ctx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'});
    if(res&&res.data&&!(res.data===last&&now-lastT<2500)){
      last=res.data;lastT=now;
      handleResult(res.data);
      if(mode!=='all')return;
    }
  }
  raf=requestAnimationFrame(tick);
}

/* ---- Đọc từ ảnh chụp bằng camera gốc (nét, độ phân giải cao) ---- */
let photoTarget='all';
function pickPhoto(target){photoTarget=target;$('file').value='';$('file').click()}
async function decodeImage(file){
  const url=URL.createObjectURL(file);
  const img=new Image();
  await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});
  const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});
  let found=null;
  for(const maxD of [2400,1600,1000]){
    const s=Math.min(1,maxD/Math.max(img.naturalWidth,img.naturalHeight));
    c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    ctx.drawImage(img,0,0,c.width,c.height);
    const r=jsQR(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'attemptBoth'});
    if(r&&r.data){found=r.data;break}
  }
  URL.revokeObjectURL(url);
  return found;
}
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const wasOpen=$('ov').classList.contains('on');
  if(wasOpen)$('msg').textContent='Đang đọc ảnh…';
  try{
    const data=await decodeImage(f);
    if(data){
      if(wasOpen){mode=photoTarget;handleResult(data);if(photoTarget!=='all')return}
      else{
        if(photoTarget==='all'){rows.push({stt:nextStt(),qr:data})}else{rows[photoTarget].qr=data}
        render();if(navigator.vibrate)navigator.vibrate(80);
      }
    }else{
      const m='Không đọc được mã trong ảnh. Chụp lại gần hơn, rõ nét, mã chiếm 1/3 khung ảnh.';
      if(wasOpen)$('msg').textContent=m;else alert(m);
    }
  }catch(err){alert('Không mở được ảnh.')}
};

$('scanAll').onclick=()=>startScan('all');
$('photoAll').onclick=()=>pickPhoto('all');
$('photoOv').onclick=()=>pickPhoto(mode);
$('close').onclick=stopScan;
$('add').onclick=()=>{rows.push({stt:nextStt(),qr:''});render()};
$('clr').onclick=()=>{if(confirm('Xóa toàn bộ dữ liệu?')){rows=[];render()}};
$('csv').onclick=()=>{
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const csv='\uFEFFSTT,Mã QR\n'+rows.map(r=>q(r.stt)+','+q(r.qr)).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='du-lieu-qr.csv';a.click();
};
$('q').oninput=e=>{query=e.target.value;render()};
$('dupT').onclick=()=>{onlyDup=!onlyDup;render()};
$('dupX').onclick=()=>{
  const seen=new Set();
  const keep=rows.filter(r=>{if(!r.qr)return true;if(seen.has(r.qr))return false;seen.add(r.qr);return true});
  const n=rows.length-keep.length;
  if(!n){alert('Không có mã trùng.');return}
  if(confirm('Xóa '+n+' dòng trùng (giữ dòng đầu tiên của mỗi mã)?')){rows=keep;render()}
};
render();
</script>
</body>
</html>
