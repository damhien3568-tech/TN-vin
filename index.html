<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Quét QR</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--pr:#2563eb;--bd:#e5e7eb;--dg:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2027;--tx:#eceff3;--mu:#9aa3af;--bd:#2c333c}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:0 12px calc(var(--dh,96px) + 16px)}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;-webkit-tap-highlight-color:transparent}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.lb{color:var(--mu);font-size:13px}
/* thanh trên */
#top{position:sticky;top:0;z-index:4;background:var(--bg);margin:0 -12px;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px}
.r1{display:flex;gap:8px;align-items:center}
#tabs{display:flex;gap:6px;flex:1;min-width:0}
.tab{flex:1;min-width:0;padding:8px 6px;font-size:14px;border-radius:999px;background:var(--card);color:var(--tx);border:1px solid var(--bd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.ib{flex:none;width:42px;height:36px;padding:0;font-size:20px;line-height:1;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px}
.r2{display:flex;align-items:center;gap:6px;margin-top:6px}
.chip{flex:none;padding:5px 12px;font-size:13px;border-radius:999px;background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}
.cnt{flex:1;min-width:0;text-align:right;color:var(--mu);font-size:12px;line-height:1.25}
/* danh sách */
.wrap{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.rw{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--bd)}
.rw:last-child{border-bottom:0}
.rw.ex{background:rgba(245,158,11,.2)}
input.stt{width:48px;flex:none;font:inherit;font-size:15px;text-align:center;padding:8px 2px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.qin{flex:1;width:100%;min-width:0;font:600 14px ui-monospace,Menlo,monospace;letter-spacing:0;padding:9px 6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.qin.bad{border-color:var(--dg);background:rgba(220,38,38,.1)}
.qin.ocr{border:1px dashed #f59e0b;background:rgba(245,158,11,.12)}
.pb{flex:none;width:40px;height:40px;padding:0;border-radius:10px;background:var(--card);color:var(--tx);border:1px solid var(--bd);overflow:hidden;font-size:18px;line-height:1}
.pb img{width:100%;height:100%;object-fit:cover;display:block}
.rw button.d{flex:none;background:none;color:var(--dg);padding:6px;font-size:16px;line-height:1}
/* thanh dưới kiểu chat */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--bd);padding:8px 12px calc(env(safe-area-inset-bottom) + 8px)}
body.editing #dock{display:none}
.qs{font-size:13px;margin:0 2px 6px;word-break:break-all}
#mkrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#mkrow .lb{flex:1}
#sw{display:flex;gap:10px}
.mkc{width:38px;height:38px;padding:0;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
#mkOff{padding:6px 12px;font-size:13px;border-radius:999px}
.inrow{display:flex;align-items:center;gap:10px}
.sbox{flex:1;min-width:0;display:flex;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:24px}
#q{flex:1;min-width:0;font:inherit;border:0;background:transparent;color:var(--tx);padding:12px 14px;resize:none;max-height:112px;overflow-y:auto;outline:none;border-radius:24px;line-height:1.3;display:block}
#qx{flex:none;width:30px;height:30px;margin-right:6px;padding:0;border-radius:50%;background:var(--bd);color:var(--tx);font-size:14px}
#camBtn{flex:none;position:relative;width:58px;height:58px;border-radius:50%;padding:0;background:transparent;border:3px solid var(--tx)}
#camBtn .in{position:absolute;inset:4px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .1s}
#camBtn:active .in{transform:scale(.88)}
#camBtn .bd{position:absolute;top:-8px;right:-8px;min-width:22px;padding:2px 6px;border-radius:11px;background:var(--pr);color:#fff;font-size:11px;line-height:1.3;text-align:center;font-weight:600}
#toast{position:fixed;left:12px;right:12px;bottom:calc(var(--dh,96px) + 10px);background:#111827;color:#fff;padding:12px 14px;border-radius:12px;z-index:8;display:none;font-size:15px;word-break:break-all}
#toast.on{display:block}
/* bảng chọn: menu và chọn ảnh */
#pk,#mn{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:12;display:none;align-items:flex-end}
#pk.on,#mn.on{display:flex}
.pkb{width:100%;background:var(--card);border-radius:16px 16px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow-y:auto}
#pkt{color:var(--mu);font-size:14px;text-align:center;word-break:break-all}
.pkb button{padding:13px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{text-align:left}
#clr{grid-column:1/-1;color:var(--dg)}
/* xem ảnh */
#vw{position:fixed;inset:0;background:#000;z-index:10;display:none;flex-direction:column}
#vw.on{display:flex}
#vi{flex:1;min-height:0;width:100%;object-fit:contain}
#vw .vb{padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);text-align:center;color:#fff}
#vw .vb button{margin:8px 4px 0;background:#fff;color:#000}
/* camera trong app */
#ov{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:9}
#ov.on{display:flex}
video{flex:1;width:100%;object-fit:cover;min-height:0}
#st{color:#fff;padding:12px;text-align:center;background:#000;padding-bottom:calc(env(safe-area-inset-bottom) + 12px)}
#st button{margin:8px 3px 0;background:#fff;color:#000}
#st .cr{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
#st .cr button{margin:0}
#st .cr .sd{width:76px;display:flex;align-items:center}
#st .cr .sd:last-child{justify-content:flex-end}
#st .cr #snap{width:76px;height:76px;padding:0;border-radius:50%;background:transparent;border:4px solid #fff;position:relative}
#snap::after{content:'';position:absolute;inset:5px;border-radius:50%;background:#fff;transition:transform .1s}
#snap:active::after{transform:scale(.88)}
#lt{width:56px;height:56px;border-radius:10px;border:2px solid #fff;object-fit:cover;background:#222;visibility:hidden}
#lt.on{visibility:visible}
.fr{position:absolute;left:50%;top:40%;width:60vw;max-width:280px;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #22c55e;border-radius:16px;pointer-events:none}
.lead{flex:none;width:26px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--mu);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.lead.chk{font-size:22px}
.lead.chk.on{color:var(--pr)}
.rw.drag{background:var(--card)!important;box-shadow:0 6px 18px rgba(0,0,0,.28)!important;position:relative;z-index:2}
.rw button.mo{flex:none;background:none;color:var(--tx);padding:6px 8px;font-size:20px;line-height:1;font-weight:700}
.cdot{flex:none;width:26px;height:26px;padding:0;border-radius:50%;border:2px solid rgba(0,0,0,.2)}
.cdot.on{border:3px solid var(--tx);transform:scale(1.12)}
.r2{flex-wrap:wrap}
.cnt{flex:1 1 100%;text-align:left;margin-top:2px}
#mkrow{gap:6px}
#sw{gap:6px}
.mkc{width:32px;height:32px}
#mkrow .tbn{width:36px;height:36px;padding:0;font-size:17px;border-radius:10px;flex:none}
#mkrow .sep{flex:1}
input.stt{width:52px;font-size:14px}
#gs,#pd{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:12;display:none;align-items:flex-end}
#gs.on,#pd.on{display:flex}
#gsb{display:flex;flex-direction:column;gap:10px}
#gst{color:var(--mu);font-size:14px;text-align:center;word-break:break-all}
#gsb button.danger{color:var(--dg)}
#pdt{width:100%;font:inherit;font-size:16px;border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--bg);color:var(--tx);resize:vertical;min-height:130px}
.cd{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 10px;vertical-align:-1px;border:1px solid rgba(0,0,0,.3)}
.cd.h{background:transparent;border:1.5px solid var(--mu)}
#cnt b{color:var(--tx);font-size:14px}
</style>
</head>
<body>
<header id="top">
  <div class="r1"><div id="tabs"></div><button class="ib" id="menuBtn" aria-label="Menu">⋯</button></div>
  <div class="r2" id="r2n"><button class="chip" id="dupT">Trùng</button><button class="chip" id="noI">Chưa ảnh</button><span id="cf" style="display:flex;gap:8px;margin-left:4px"></span><div class="cnt" id="cnt"></div></div>
  <div class="r2" id="r2s" hidden><span class="lb" id="sct" style="flex:1">Đã chọn 0</span><button class="chip" id="sAll">Chọn hết</button><button class="chip" id="sNone">Bỏ chọn</button><button class="chip on" id="sDone">Xong</button></div>
</header>
<div class="wrap" id="tb"></div>
<div id="dock">
  <div class="qs" id="qs" hidden></div>
  <div id="mkrow" hidden><span id="sw"></span><button class="g tbn" id="mkOff" aria-label="Bỏ màu">⊘</button><span class="sep"></span><button class="g tbn" id="aCopy" aria-label="Sao chép">📋</button><button class="g tbn" id="aSave" aria-label="Lưu">💾</button><button class="g tbn" id="aMove" aria-label="Di chuyển">➡️</button><button class="g tbn" id="aDel" aria-label="Xóa" style="color:var(--dg)">🗑</button></div>
  <div class="inrow">
    <div class="sbox"><textarea id="q" rows="1" placeholder="Tìm STT hoặc VIN, dán nhiều mã…"></textarea><button id="qx" hidden aria-label="Xóa ô tìm">✕</button></div>
    <button id="camBtn" aria-label="Chụp và quét"><span class="in"></span><span class="bd" id="nx">1</span></button>
  </div>
</div>
<input type="file" id="imp" accept="image/*" multiple hidden>
<input type="file" id="rimp" accept="image/*" hidden>
<div id="toast"></div>
<div id="mn"><div class="pkb">
  <div class="grid">
    <button class="g" id="scanAll">🎥 Quét liên tục</button>
    <button class="g" id="impBtn">🖼 Nhập ảnh</button>
    <button class="g" id="add">＋ Thêm dòng</button>
    <button class="g" id="csv">📄 Xuất CSV</button>
    <button class="g" id="saveAll">💾 Lưu ảnh</button>
    <button class="g" id="kb">⌨ Bàn phím</button>
    <button class="g" id="dupX">🧹 Xóa mã trùng</button>
    <button class="g" id="rn">✏️ Đổi tên sheet</button>
    <button class="g" id="selBtn">☑ Chọn nhiều dòng</button>
    <button class="g" id="pasteBtn">📥 Dán từ Excel</button>
    <button class="g" id="renum">🔢 Đánh lại STT</button>
    <button class="g" id="clr">🗑 Xóa hết sheet này</button>
  </div>
  <div class="lb">Nền cam: ảnh có VIN không có trong danh sách · Ô VIN viền cam nét đứt: đọc bằng OCR, nên kiểm tra · Mỗi mã trùng một màu · Chạm ⠿ để chọn, kéo ⠿ để sắp xếp · bản 17</div>
  <button class="g" id="mnx">Đóng</button>
</div></div>
<div id="pk"><div class="pkb"><div id="pkt"></div><button id="pkc">📷 Chụp ảnh</button><button id="pkl">🖼 Chọn từ Thư viện</button><button class="g" id="pkx">Hủy</button></div></div>
<div id="gs"><div class="pkb"><div id="gst"></div><div id="gsb"></div><button class="g" id="gsx">Hủy</button></div></div>
<div id="pd"><div class="pkb">
  <div class="lb">Dán dữ liệu từ Excel: cột STT và cột VIN, hoặc chỉ cột VIN</div>
  <textarea id="pdt" placeholder="Chạm giữ vào đây rồi chọn Dán…"></textarea>
  <label class="lb"><input type="checkbox" id="pds" checked> Dùng số đầu dòng làm STT (bỏ chọn để tự đánh số tiếp)</label>
  <div class="lb" id="pdi"></div>
  <div class="grid"><button class="g" id="pdp">📥 Dán từ bộ nhớ tạm</button><button id="pdo">Thêm vào sheet</button></div>
  <button class="g" id="pdx">Hủy</button>
</div></div>
<div id="vw"><img id="vi" alt=""><div class="vb"><div id="vcap"></div><button id="vok" style="display:none">✓ Đúng</button><button id="vch">🔄 Đổi ảnh</button><button id="vdel">🗑 Xóa ảnh</button><button id="vs">💾 Lưu ảnh</button><button id="vc">Đóng</button></div></div>

<div id="ov">
  <video id="v" playsinline muted></video>
  <div class="fr"></div>
  <div id="st"><div id="msg">Đang mở camera…</div><div id="dbg" style="display:none;font-size:11px;color:#9ca3af;margin-top:4px"></div><div class="cr"><div class="sd"><img id="lt" alt=""></div><button id="snap" aria-label="Chụp"></button><div class="sd"><button id="close">Đóng</button></div></div><button id="pick" style="display:none">📷 Camera máy</button> <button id="dump" style="display:none">🐞 Lưu khung hình</button><input type="file" id="ph" accept="image/*" capture="environment" hidden></div>
</div>
<canvas id="cv" hidden></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';document.head.appendChild(s)"></script>
<script>
const KEYS=['qr_rows_v1','qr_rows_s2','qr_rows_s3'];
let sheet=0;try{sheet=Math.min(2,Math.max(0,parseInt(localStorage.getItem('qr_sheet')||'0',10)||0))}catch(e){}
let names=['Sheet 1','Sheet 2','Sheet 3'];
try{const n=JSON.parse(localStorage.getItem('qr_names')||'null');if(Array.isArray(n)&&n.length===3)names=n.map((x,i)=>String(x||'Sheet '+(i+1)))}catch(e){}
let rows=[];
const loadRows=()=>{try{rows=JSON.parse(localStorage.getItem(KEYS[sheet])||'[]')}catch(e){rows=[]}if(!Array.isArray(rows))rows=[]};
loadRows();
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEYS[sheet],JSON.stringify(rows))}catch(e){}};
const isBlank=r=>r&&!r.qr&&!r.img&&!r.fail;
// TÌM-NHIỀU-MÃ-START
const tokenize=q=>[...new Set(String(q||'').toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean))];
const hitTok=(r,t)=>String(r.stt).toUpperCase()===t||(t.length>=3&&String(r.qr||'').toUpperCase().includes(t));
// TÌM-NHIỀU-MÃ-END
const nextStt=()=>{const n=rows.map(r=>parseFloat(r.stt)).filter(x=>!isNaN(x));return String(n.length?Math.max(...n)+1:1)};

function newRow(){const l=rows[rows.length-1];if(isBlank(l))return l;const r={stt:nextStt(),qr:''};rows.push(r);return r}
let query='',onlyDup=false,onlyNoImg=false,focusIdx=null;
let selMode=false;const selSet=new Set(),colorFilter=new Set(),elOf=new WeakMap();let curDi=null;
const MARKS=[['#fde047','Vàng'],['#86efac','Xanh'],['#f87171','Đỏ']];
const MARKN=MARKS.concat([['#fdba74','Cam'],['#f9a8d4','Hồng'],['#93c5fd','Xanh dương']]);
let kbOn=false;try{kbOn=localStorage.getItem('qr_kb')==='1'}catch(e){}
const filtering=()=>tokenize(query).length>0||onlyDup||onlyNoImg||colorFilter.size>0;

const kq=r=>String(r.qr||'').toUpperCase().replace(/\s+/g,'');
function dupInfo(){
  const cnt={};rows.forEach(r=>{const k=kq(r);if(k)cnt[k]=(cnt[k]||0)+1});
  const grp={};let gi=0,nd=0;
  rows.forEach(r=>{const k=kq(r);if(k&&cnt[k]>1){nd++;if(grp[k]===undefined)grp[k]=gi++}});
  return {grp,nd,ng:gi,isDup:r=>{const k=kq(r);return !!k&&cnt[k]>1},hue:r=>(grp[kq(r)]*67+10)%360};
}
function visibleIdx(di){
  const toks=tokenize(query),out=[];
  rows.forEach((r,i)=>{
    if(onlyDup&&!di.isDup(r))return;
    if(onlyNoImg&&(r.img||!r.qr))return;
    if(colorFilter.size&&!colorFilter.has(r.mark))return;
    if(toks.length&&!toks.some(t=>hitTok(r,t)))return;
    out.push(i);
  });
  return out;
}
function ensureVisible(el){
  const r=el.getBoundingClientRect();
  const top=$('top').offsetHeight+6;
  const dk=$('dock');const bot=window.innerHeight-(dk.offsetHeight||0)-6;
  if(r.top<top)window.scrollBy(0,r.top-top);
  else if(r.bottom>bot)window.scrollBy(0,r.bottom-bot);
}
function focusEl(el){try{el.focus({preventScroll:true})}catch(e){el.focus()}ensureVisible(el)}

function makeRow(r,i){
  const d=document.createElement('div');d.className='rw';d._r=r;elOf.set(r,d);
  const lead=document.createElement('div');lead.className='lead';lead.textContent='⠿';
  lead.onpointerdown=e=>leadDown(e,r,d);
  const inp=document.createElement('input');inp.className='stt';inp.value=r.stt;inp.inputMode=kbOn?'numeric':'none';inp.setAttribute('aria-label','STT');
  inp.onchange=()=>{r.stt=inp.value;save();refreshInfo()};
  const qi=document.createElement('input');qi.className='qin';
  qi.value=r.qr||'';qi.placeholder=r.fail?'Nhập tay VIN':'(chưa có mã)';
  qi.setAttribute('autocapitalize','characters');qi.setAttribute('autocomplete','off');qi.spellcheck=false;
  qi.dataset.i=i;qi.setAttribute('enterkeyhint','next');qi.setAttribute('inputmode',kbOn?'text':'none');
  const commit=adv=>{
    if(!qi.isConnected)return;
    const v=cleanVin(qi.value);
    if(qi.value!==v)qi.value=v;
    if(v!==(r.qr||'')){r.qr=v;r.extra=false;r.ocr=false;if(v)r.fail=false}
    const idx=rows.indexOf(r);
    if(filtering()){
      if(v&&idx===rows.length-1){rows.push({stt:nextStt(),qr:''});if(adv)focusIdx=rows.length-1}
      else if(adv&&v&&idx>=0&&idx<rows.length-1)focusIdx=idx+1;
      save();render();return;
    }
    if(v&&idx===rows.length-1){
      const nr={stt:nextStt(),qr:''};rows.push(nr);
      const el=makeRow(nr,rows.length-1);$('tb').appendChild(el);
      if(adv)focusEl(el._qi);
    }else if(adv&&v&&idx>=0&&idx<rows.length-1){
      const nx=$('tb').querySelector('.qin[data-i="'+(idx+1)+'"]');if(nx)focusEl(nx);
    }
    save();restyle();
  };
  qi.onchange=()=>commit(false);
  qi.onkeydown=e=>{if(e.key==='Enter'||(e.key==='Tab'&&!e.shiftKey&&qi.value.trim())){e.preventDefault();commit(true)}};
  // dán nhiều dòng từ Excel vào ô VIN: tách thành nhiều dòng
  qi.onpaste=e=>{
    const t=(e.clipboardData||window.clipboardData).getData('text');
    const list=parsePaste(t);
    if(list.length>=2){e.preventDefault();addParsed(list,true,rows.indexOf(r));toast('Đã dán '+list.length+' dòng.')}
  };
  const pb=document.createElement('button');pb.className='pb';
  if(r.img){const im=document.createElement('img');im.alt='';thumbFor(r.img,im);pb.appendChild(im);pb.onclick=()=>openViewer(r)}
  else{pb.textContent='📷';pb.onclick=()=>{const k=rows.indexOf(r);if(k>=0)openPicker(k)}}
  const mo=document.createElement('button');mo.className='mo';mo.textContent='⋯';mo.setAttribute('aria-label','Tùy chọn dòng');
  mo.onclick=()=>rowMenu(r);
  d._qi=qi;d._inp=inp;d._lead=lead;
  d.append(lead,inp,qi,pb,mo);
  return d;
}
function styleRow(d,r,di){
  const qi=d._qi,inp=d._inp,lead=d._lead;
  d.className='rw'+(r.extra?' ex':'');
  qi.className='qin'+(r.fail&&!r.qr?' bad':'')+(r.ocr?' ocr':'');
  if(di.isDup(r)){const h=di.hue(r);d.style.background='hsla('+h+',85%,50%,.25)';d.style.boxShadow='inset 6px 0 0 hsl('+h+',80%,45%)';qi.style.borderColor='hsl('+h+',80%,45%)'}

function tileList(w,h,T){
  const pos=(n)=>{if(n<=T)return[0];const st=Math.round(T*0.6),a=[];for(let p=0;p<n-T;p+=st)a.push(p);a.push(n-T);return a};
  const t=[];for(const y of pos(h))for(const x of pos(w))t.push([x,y]);
  const cx=w/2,cy=h/2;
  return t.sort((p,q)=>Math.hypot(p[0]+T/2-cx,p[1]+T/2-cy)-Math.hypot(q[0]+T/2-cx,q[1]+T/2-cy));
}
// OCR-HELPERS-START
const CF=new Set(['0O','0Q','0D','1I','1L','5S','8B','2Z','6G','UV','MN']);
const subc=(a,b)=>a===b?0:((CF.has(a+b)||CF.has(b+a))?0.4:1);
// chi phí khớp gần đúng của chuỗi P (VIN) ở vị trí bất kỳ trong văn bản T
function fuzzyCost(P,T){
  const m=P.length;let prev=new Float32Array(m+1),cur=new Float32Array(m+1);
  for(let i=0;i<=m;i++)prev[i]=i;
  let best=prev[m];
  for(let j=1;j<=T.length;j++){
    const t=T[j-1];cur[0]=0;
    for(let i=1;i<=m;i++)cur[i]=Math.min(prev[i-1]+subc(P[i-1],t),prev[i]+1,cur[i-1]+1);
    if(cur[m]<best)best=cur[m];
    const x=prev;prev=cur;cur=x;
  }
  return best;
}
const FIXD={O:'0',Q:'0',D:'0',I:'1',L:'1',S:'5',B:'8',Z:'2',G:'6'};
function vinFromText(S,known){
  // 1) đối chiếu với danh sách VIN đã nhập: chỉ nhận khi chỉ có 1 VIN gần đúng rõ rệt
  if(known.length){
    let best=null,b1=1e9,b2=1e9;
    for(const v of known){const c=fuzzyCost(v,S);if(c<b1){b2=b1;b1=c;best=v}else if(c<b2)b2=c}
    if(best&&b1<=1.6&&b2-b1>=0.9)return best;
  }
  // 2) dựng VIN theo cấu trúc RL?xxxxxx?TH + 6 số (sửa nhầm chữ/số ở 6 số cuối)
  for(let i=S.indexOf('TH',9);i>=0;i=S.indexOf('TH',i+1)){
    if(i+8>S.length)break;
    const tail=S.slice(i+2,i+8).replace(/[OQDILSBZG]/g,ch=>FIXD[ch]);
    const cand=S.slice(i-9,i)+'TH'+tail;
    if(/^RL[LN][A-Z0-9]{5}[0-9X]TH[0-9]{6}$/.test(cand))return cand;
  }
  return null;
}
// OCR-HELPERS-END
let ocrW=null,ocrP=null,ocrBad=false;
function loadScript(u){return new Promise((res,rej)=>{const e=document.createElement('script');e.src=u;e.onload=res;e.onerror=rej;document.head.appendChild(e)})}
async function getOcr(){
  if(ocrW)return ocrW;
  if(ocrBad)return null;
  if(!ocrP)ocrP=(async()=>{
    try{
      toast('Đang tải bộ đọc chữ (lần đầu, cần mạng)…',0);
      if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
      const wk=await Tesseract.createWorker('eng',1);
      await wk.setParameters({tessedit_char_whitelist:'ABCDEFGHJKLMNPRSTUVWXYZ0123456789',tessedit_pageseg_mode:'11'});
      ocrW=wk;return wk;
    }catch(e){ocrBad=true;toast('Không tải được bộ đọc chữ (OCR). Kiểm tra mạng rồi thử lại.',6000);return null}
  })();
  return ocrP;
}
async function ocrVin(src,w,h){
  const wk=await getOcr();if(!wk)return null;
  const known=[...new Set(rows.map(r=>normV(r.qr)).filter(v=>v.length>=10))];
  for(const [x,y,sw,sh,side] of [[0,0,w,h,1800],[w*0.15,h*0.15,w*0.7,h*0.7,2000]]){
    const k=Math.min(1,side/Math.max(sw,sh)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(sw*k));c.height=Math.max(1,Math.round(sh*k));
    let txt='';
    try{c.getContext('2d').drawImage(src,x,y,sw,sh,0,0,c.width,c.height);const r=await wk.recognize(c);txt=(r&&r.data&&r.data.text)||''}catch(e){}
    c.width=c.height=0;
    const S=txt.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(S.length<10)continue;
    const v=vinFromText(S,known);if(v)return v;
  }
  return null;
}
let decVia='qr';
async function decodeStill(src,w,h){
  decVia='qr';
  const yld=()=>new Promise(r=>setTimeout(r));
  const s=Math.min(w,h)*0.7;
  // Cách 1: cả ảnh thu nhỏ và vùng giữa
  for(const [x,y,sw,sh] of [[0,0,w,h],[(w-s)/2,(h-s)/2,s,s]])for(const m of [3,0,2]){
    await yld();const t=window.jsQR?tryDecode(src,x,y,sw,sh,1500,m):null;if(t)return t;
  }
  // Cách 1b: không đọc được QR thì đọc chữ VIN in trên tem (OCR), đối chiếu với danh sách đã nhập
  const ov=await ocrVin(src,w,h);if(ov){decVia='ocr';return ov}
  // Cách 2: cắt thành nhiều ô nhỏ ở độ phân giải gốc (mã nhỏ trong ảnh lớn), ô giữa thử trước
  const T=Math.min(1100,Math.min(w,h));
  for(const [x,y] of tileList(w,h,T))for(const m of [3,0,2]){
    await yld();const t=window.jsQR?tryDecode(src,x,y,T,T,T,m):null;if(t)return t;
  }
  return null;
}
const normV=s=>String(s||'').toUpperCase().replace(/\s+/g,'');
const hasPending=()=>rows.some(r=>r.qr&&!r.img);
function findRow(code){
  const c=normV(code);if(!c)return null;
  const m=rows.filter(r=>r.qr&&normV(r.qr)===c);
  return m.find(r=>!r.img)||m[0]||null;
}
async function addFromImage(src,w,h,target){
  const imgP=savePhoto(src,w,h);
  const code=await decodeStill(src,w,h);
  const via=decVia;
  const id=await imgP;
  let row,matched=false,kept=false;
  if(target==='new'){
    // tìm dòng đã nhập sẵn có đúng số VIN này để gắn ảnh vào
    const hit=code?findRow(code):null;
    if(hit){row=hit;matched=true;if(row.img&&row.img!==id)dropPhoto(row.img);row.img=id;row.fail=false;row.extra=false}
    else{const pend=hasPending();row=newRow();row.img=id;if(code&&pend)row.extra=true}
  }else{
    row=rows[target];if(!row)return null;
    if(row.img&&row.img!==id)dropPhoto(row.img);
    row.img=id;
    // dòng đã có VIN mà ảnh đọc ra mã khác: hỏi trước khi đổi
    if(code&&row.qr&&normV(code)!==normV(row.qr)){
      if(!confirm('Mã đọc từ ảnh: '+code+'\nKhác VIN đang có: '+row.qr+'\n\nĐổi VIN của dòng này thành '+code+'?'))kept=true;
    }
  }
  const cd=kept?null:code;
  if(cd){if(!matched)row.qr=cd;row.fail=false;row.ocr=(via==='ocr')}else if(!row.qr)row.fail=true;
  render();
  if(navigator.vibrate)navigator.vibrate(cd?80:[80,60,80]);
  return {row,code:cd,matched,kept,seen:code};
}

    if(keep&&r.img)c.img=await clonePhoto(r.img);
    dest.push(c);
  }
  try{localStorage.setItem(KEYS[k],JSON.stringify(dest))}catch(e){toast('Không đủ chỗ lưu sang '+names[k]+'.');return}
  if(!keep){const set=new Set(list);rows=rows.filter(r=>!set.has(r));list.forEach(r=>selSet.delete(r));save();render()}
  toast((keep?'Đã chép ':'Đã chuyển ')+list.length+' dòng sang '+names[k]+'.');
}
function bulk(kind){
  const list=targets();
  if(!list.length){toast(selMode?'Chưa chọn dòng nào.':'Không có dòng nào đang hiện.');return}
  const n=list.length;
  if(kind==='copy')openSheet('Sao chép '+n+' dòng',[
    ['Chỉ mã VIN',()=>copyText(list.map(r=>r.qr||'').join('\n'),'Đã sao chép '+n+' mã VIN.')],
    ['STT + VIN (dán được vào Excel)',()=>copyText(list.map(r=>r.stt+'\t'+(r.qr||'')).join('\n'),'Đã sao chép '+n+' dòng.')]
  ]);
  else if(kind==='save')openSheet('Lưu '+n+' dòng',[
    ['📄 Lưu file CSV',()=>downloadCsv(list,'chon')],
    ['🖼 Lưu ảnh vào Thư viện',()=>sharePhotos(list)]
  ]);
  else if(kind==='move'){
    const items=[];
    names.forEach((nm,k)=>{if(k!==sheet){items.push(['➡️ Di chuyển tới '+nm,()=>moveRows(list,k,false)]);items.push(['⧉ Chép sang '+nm+' (giữ lại ở đây)',()=>moveRows(list,k,true)])}});
    openSheet('Di chuyển '+n+' dòng',items);
  }
  else if(kind==='del')deleteRows(list);
}
$('aCopy').onclick=()=>bulk('copy');
$('aSave').onclick=()=>bulk('save');
$('aMove').onclick=()=>bulk('move');
$('aDel').onclick=()=>bulk('del');
$('renum').onclick=()=>{if(!rows.length||!confirm('Đánh lại STT từ 1 đến '+rows.length+' theo thứ tự hiện tại?'))return;rows.forEach((r,i)=>{r.stt=String(i+1)});save();render()};

// lọc theo màu
MARKS.forEach(m=>{const b=document.createElement('button');b.className='cdot';b.style.background=m[0];b.setAttribute('aria-label','Lọc màu '+m[1]);b.onclick=()=>{if(colorFilter.has(m[0]))colorFilter.delete(m[0]);else colorFilter.add(m[0]);render()};$('cf').appendChild(b)});

// tô màu STT cho các dòng đã chọn, hoặc các dòng đang hiện khi tìm/lọc
function applyMark(m){
  const list=targets().filter(r=>r.qr);
  if(!list.length){toast(selMode?'Chưa chọn dòng nào.':'Không có dòng nào đang hiện để tô màu.');return}
  if(list.every(r=>r.mark===m[0])){list.forEach(r=>{delete r.mark});save();render();toast('Đã bỏ màu '+list.length+' dòng.');return}
  list.forEach(r=>{r.mark=m[0]});save();render();
  toast('Đã tô '+m[1].toLowerCase()+' cho '+list.length+' dòng.');
}
MARKS.forEach(m=>{const b=document.createElement('button');b.className='mkc';b.style.background=m[0];b.setAttribute('aria-label',m[1]);b.onclick=()=>applyMark(m);$('sw').appendChild(b)});
$('mkOff').onclick=()=>{
  const list=targets().filter(r=>r.mark);
  if(!list.length){toast('Các dòng này chưa có màu.');return}
  list.forEach(r=>{delete r.mark});save();render();toast('Đã bỏ màu '+list.length+' dòng.');
};

// ===== dán từ Excel =====
function parsePaste(text){
  const out=[];
  String(text||'').split(/\r?\n/).forEach(line=>{
    line=line.trim();if(!line)return;
    const up=line.toUpperCase(),toks=up.split(/[\t,;\s]+/).filter(Boolean);
    const m=up.match(/[A-HJ-NPR-Z0-9]{17}/);
    let vin=m?m[0]:null;
    if(!vin){const c=toks.filter(t=>/^[A-Z0-9]{6,}$/.test(t)).sort((a,b)=>b.length-a.length)[0];if(c)vin=c}
    if(!vin)return;
    const stt=toks.find(t=>/^[0-9]{1,9}$/.test(t)&&t!==vin)||null;
    out.push({stt,vin});
  });
  return out;
}
function addParsed(list,useStt,atIdx){
  let auto=parseFloat(nextStt());if(isNaN(auto))auto=1;
  const news=list.map(p=>({stt:(useStt&&p.stt)?p.stt:String(auto++),qr:cleanVin(p.vin)}));
  if(atIdx===null||atIdx===undefined||atIdx<0){
    while(rows.length&&isBlank(rows[rows.length-1]))rows.pop();
    news.forEach(n=>rows.push(n));
  }else{
    const cur=rows[atIdx];
    if(cur&&!cur.qr){cur.qr=news[0].qr;if(useStt&&list[0].stt)cur.stt=news[0].stt;news.shift()}
    rows.splice(atIdx+1,0,...news);
  }
  clearFilters();save();render();
}
function pdInfo(){
  const list=parsePaste($('pdt').value);
  const have=new Set(rows.map(kq).filter(Boolean));
  const dup=list.filter(p=>have.has(p.vin)).length;
  $('pdi').textContent=list.length?('Tìm thấy '+list.length+' dòng'+(dup?' · '+dup+' mã đã có trong sheet':'')):'Chưa có dữ liệu để thêm.';
  return list;
}
$('pasteBtn').onclick=()=>{$('pdt').value='';pdInfo();$('pd').classList.add('on')};
$('pdt').oninput=pdInfo;
$('pdx').onclick=()=>$('pd').classList.remove('on');
$('pdp').onclick=async()=>{
  try{const t=await navigator.clipboard.readText();$('pdt').value=t;pdInfo()}
  catch(e){toast('Không đọc được bộ nhớ tạm. Chạm giữ vào ô rồi chọn Dán.')}
};
$('pdo').onclick=()=>{
  const list=pdInfo();
  if(!list.length){toast('Chưa có dữ liệu để thêm.');return}
  $('pd').classList.remove('on');
  addParsed(list,$('pds').checked,null);
  toast('Đã thêm '+list.length+' dòng vào '+names[sheet]+'.');
};

// ===== kéo thả: chạm ⠿ để chọn, kéo ⠿ để sắp xếp (hoặc quét chọn nhiều dòng khi đang ở chế độ chọn) =====
let gest=null;
function rowAt(x,y){const el=document.elementFromPoint(x,y);const d=el&&el.closest?el.closest('.rw'):null;return d&&d.parentNode===$('tb')?d:null}
function leadDown(e,r,d){
  if(e.button!==undefined&&e.button!==0)return;
  e.preventDefault();
  gest={r,d,x0:e.clientX,y0:e.clientY,cx:e.clientX,cy:e.clientY,moved:false,mode:null,pid:e.pointerId,raf:0,vy:0};
  try{d._lead.setPointerCapture(e.pointerId)}catch(_){}
  window.addEventListener('pointermove',leadMove);
  window.addEventListener('pointerup',leadUp);
  window.addEventListener('pointercancel',leadUp);
}
function leadMove(e){
  const g=gest;if(!g||e.pointerId!==g.pid)return;
  g.cx=e.clientX;g.cy=e.clientY;
  if(!g.moved){
    if(Math.abs(e.clientY-g.y0)<6&&Math.abs(e.clientX-g.x0)<6)return;
    g.moved=true;
    const kids=$('tb').children;
    if(selMode){
      g.mode='range';g.want=!selSet.has(g.r);g.base=new Set(selSet);g.startPos=Array.prototype.indexOf.call(kids,g.d);g.prev=null;
    }else if(filtering()){
      g.mode='none';toast('Bỏ tìm hoặc lọc để kéo sắp xếp.');
    }else{
      g.mode='reorder';g.d.classList.add('drag');
      if(navigator.vibrate)navigator.vibrate(12);
    }
  }
  if(g.mode==='none')return;
  const topL=$('top').getBoundingClientRect().bottom+28,botL=window.innerHeight-($('dock').offsetHeight||0)-28;
  g.vy=g.cy<topL?-Math.min(20,(topL-g.cy)/3+3):(g.cy>botL?Math.min(20,(g.cy-botL)/3+3):0);
  gestHit(g);
  if(g.vy&&!g.raf){const step=()=>{if(gest!==g||!g.vy){g.raf=0;return}window.scrollBy(0,g.vy);gestHit(g);g.raf=requestAnimationFrame(step)};g.raf=requestAnimationFrame(step)}
}
function gestHit(g){
  const hit=rowAt(g.cx,g.cy);if(!hit)return;
  const tb=$('tb');
  if(g.mode==='reorder'){
    if(hit===g.d)return;
    const rc=hit.getBoundingClientRect();
    if(g.cy<rc.top+rc.height/2)tb.insertBefore(g.d,hit);else tb.insertBefore(g.d,hit.nextSibling);
  }else if(g.mode==='range'){
    const kids=tb.children,cur=Array.prototype.indexOf.call(kids,hit);
    const a=Math.min(g.startPos,cur),b=Math.max(g.startPos,cur);
    if(g.prev&&g.prev[0]===a&&g.prev[1]===b)return;
    if(g.prev)for(let i=g.prev[0];i<=g.prev[1];i++){const r=kids[i]._r;setSel(r,g.base.has(r))}
    for(let i=a;i<=b;i++)setSel(kids[i]._r,g.want);
    g.prev=[a,b];
  }
}
function leadUp(e){
  const g=gest;if(!g||e.pointerId!==g.pid)return;
  window.removeEventListener('pointermove',leadMove);
  window.removeEventListener('pointerup',leadUp);
  window.removeEventListener('pointercancel',leadUp);
  gest=null;if(g.raf)cancelAnimationFrame(g.raf);
  try{g.d._lead.releasePointerCapture(g.pid)}catch(_){}
  if(e.type==='pointercancel'){g.d.classList.remove('drag');if(g.mode==='reorder')render();return}
  if(!g.moved){
    if(selMode){setSel(g.r,!selSet.has(g.r));refreshInfo()}else enterSel(g.r);
    return;
  }
  if(g.mode==='reorder'){
    g.d.classList.remove('drag');
    const kids=[...$('tb').children];
    rows.splice(0,rows.length,...kids.map(d=>d._r));
    kids.forEach((d,i)=>{d._qi.dataset.i=i});
    save();refreshInfo();
  }else if(g.mode==='range')refreshInfo();
}

// menu
$('menuBtn').onclick=()=>$('mn').classList.add('on');
$('mnx').onclick=()=>$('mn').classList.remove('on');
$('mn').addEventListener('click',e=>{if(e.target===$('mn')||e.target.closest('button'))$('mn').classList.remove('on')});
// thanh dưới luôn nằm trên bàn phím; ẩn khi đang sửa dòng bằng bàn phím ảo
if(window.visualViewport){
  const vv=window.visualViewport,fix=()=>{const off=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);$('dock').style.transform=off?'translateY(-'+off+'px)':''};
  vv.addEventListener('resize',fix);vv.addEventListener('scroll',fix);
}
if(window.ResizeObserver)new ResizeObserver(()=>{const h=$('dock').offsetHeight;if(h>0)document.documentElement.style.setProperty('--dh',h+'px')}).observe($('dock'));
document.addEventListener('focusin',e=>{if(kbOn&&e.target.matches&&e.target.matches('.qin,input.stt'))document.body.classList.add('editing')});
document.addEventListener('focusout',()=>{setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches('.qin,input.stt')))document.body.classList.remove('editing')},150)});
render();
</script>
